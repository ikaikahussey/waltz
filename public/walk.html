<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2b4a">
<title>Walk · Waltz</title>
<style>
:root { --bg:#fff; --fg:#141414; --muted:#666; --border:#e5e5e5; --accent:#1a2b4a;
  --error:#c00; --warn-bg:#fff4d6; --warn-fg:#8a5a00; }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg); color:var(--fg); -webkit-tap-highlight-color:transparent; }
header#bar { position:sticky; top:0; display:flex; align-items:center; gap:.75rem;
  padding:.7rem 1rem; background:var(--bg); border-bottom:1px solid var(--border); z-index:50; }
header#bar .name { font-weight:600; flex:1; }
header#bar a { color:var(--muted); font-size:.85rem; text-decoration:none; }
#summary { padding:.5rem 1rem; background:#f6f6f6; font-size:.9rem;
  border-bottom:1px solid var(--border); }
#summary.warn { background:var(--warn-bg); color:var(--warn-fg); font-weight:600; }
#summary.hidden { display:none; }
main { max-width:640px; margin:0 auto; padding:1rem; }
.screen.hidden, .hidden { display:none; }
h1 { font-size:1.4rem; margin:0 0 1rem; } h2 { font-size:1.15rem; margin:1rem 0 .5rem; }
h3 { font-size:1rem; margin:1rem 0 .5rem; }
label { display:block; margin:.75rem 0 .25rem; font-size:.9rem; color:var(--muted); }
input,select,textarea,button { font:inherit; width:100%; padding:.7rem;
  border:1px solid #ccc; border-radius:8px; background:var(--bg); color:var(--fg); }
button { background:var(--accent); color:#fff; border-color:var(--accent);
  font-weight:600; cursor:pointer; min-height:44px; margin-top:.5rem; }
button.secondary { background:transparent; color:var(--fg); border:1px solid var(--border); }
button.small { width:auto; min-height:0; padding:.4rem .8rem; margin:0; }
.tabs { display:flex; gap:.5rem; margin-bottom:.5rem; }
.tabs button { flex:1; }
ul.list { list-style:none; padding:0; margin:0; }
.list li { padding:.85rem .25rem; border-bottom:1px solid var(--border); cursor:pointer;
  display:flex; flex-direction:column; gap:.15rem; }
.list li .primary { font-weight:500; }
.list li .secondary { font-size:.85rem; color:var(--muted); }
.badge { display:inline-block; font-size:.72rem; padding:.1rem .4rem; border-radius:4px;
  background:var(--warn-bg); color:var(--warn-fg); margin-left:.5rem; }
.detail { background:#f8f8f8; border-radius:8px; padding:.75rem 1rem; margin:.5rem 0; }
.detail dl { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:.25rem 1rem; }
.detail dt { color:var(--muted); font-size:.85rem; } .detail dd { margin:0; font-size:.95rem; }
.sub-header { display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem; }
.sub-header h2 { margin:0; flex:1; } .back-btn { width:auto; padding:.4rem .8rem;
  background:transparent; color:var(--fg); border:1px solid var(--border); margin:0; }
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200;
  display:flex; align-items:flex-end; justify-content:center; padding:1rem; }
.modal-content { background:var(--bg); border-radius:12px 12px 0 0; padding:1rem;
  max-width:640px; width:100%; max-height:90dvh; overflow-y:auto; }
.score-radio { display:flex; gap:.5rem; margin-top:.5rem; }
.score-radio label { flex:1; margin:0; padding:.7rem; border:1px solid #ccc;
  border-radius:8px; text-align:center; cursor:pointer; }
.score-radio input { display:none; }
.score-radio label.checked { background:var(--accent); color:#fff; border-color:var(--accent); }
.error { color:var(--error); font-size:.9rem; } .status { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<header id="bar">
  <span class="name">Walk</span>
  <a href="#" id="sync-link"></a>
  <a href="/dashboard">Campaigns</a>
</header>
<div id="summary" class="hidden"></div>

<main>
  <section id="screen-loading" class="screen">
    <h1>Walk</h1><p class="status" id="loading-msg">Loading voter file…</p>
  </section>

  <section id="screen-list" class="screen hidden">
    <div class="tabs">
      <button id="tab-doors" type="button">Doors</button>
      <button id="tab-voters" type="button" class="secondary">Voters</button>
    </div>
    <input id="search" placeholder="Filter address or name" autocomplete="off">
    <ul id="house-list" class="list"></ul>
    <ul id="voter-list" class="list hidden"></ul>
  </section>

  <section id="screen-house" class="screen hidden">
    <div class="sub-header">
      <button class="back-btn" id="house-back" type="button">← Back</button>
      <h2 id="house-address">House</h2>
    </div>
    <div id="house-detail" class="detail"></div>
    <div class="tabs">
      <button id="house-not-home" class="secondary" type="button">Not home</button>
      <button id="house-inaccessible" class="secondary" type="button">Inaccessible</button>
    </div>
    <p id="house-status-msg" class="status"></p>
    <h3>Voters at this address</h3>
    <ul id="house-voters" class="list"></ul>
  </section>

  <section id="screen-voter" class="screen hidden">
    <div class="sub-header">
      <button class="back-btn" id="voter-back" type="button">← Back</button>
      <h2 id="voter-name">Voter</h2>
    </div>
    <div id="voter-detail" class="detail"></div>
    <button id="open-contact-btn" type="button">Record contact</button>
    <h3>Previous contacts</h3>
    <ul id="prev-contacts" class="list"></ul>
  </section>

  <section id="screen-notes" class="screen hidden">
    <div class="sub-header">
      <button class="back-btn" id="notes-back" type="button">← Back</button>
      <h2>Sync status</h2>
    </div>
    <p id="notes-summary" class="status"></p>
    <button id="sync-now" class="small" type="button">Try sync now</button>
    <ul id="notes-list" class="list"></ul>
  </section>
</main>

<div id="contact-modal" class="modal-backdrop hidden">
  <div class="modal-content">
    <h2>Record contact</h2>
    <form id="contact-form">
      <p class="status">Voter: <span id="contact-voter-name"></span></p>
      <label>Score
        <div class="score-radio" id="score-radio">
          <label><input type="radio" name="score" value="1"><span>1</span></label>
          <label><input type="radio" name="score" value="2"><span>2</span></label>
          <label><input type="radio" name="score" value="3"><span>3</span></label>
          <label><input type="radio" name="score" value="4"><span>4</span></label>
          <label><input type="radio" name="score" value="5"><span>5</span></label>
        </div>
      </label>
      <label>Phone <input name="phone" type="tel" autocomplete="tel"></label>
      <label>Notes <textarea name="notes" rows="4"></textarea></label>
      <button type="submit" id="contact-submit">Save</button>
      <button type="button" class="secondary" id="contact-cancel">Cancel</button>
      <p id="contact-error" class="error"></p>
    </form>
  </div>
</div>

<script>
// Campaign base path: this page is served at /c/<id>/walk.
const BASE = location.pathname.replace(/\/walk\/?$/, '');
const DB_NAME = 'waltz' + BASE.replace(/\W+/g, '_');
let APP_DATA = { houses: [], voters: [] };
let HOUSES_BY_ID = new Map(), VOTERS_BY_ID = new Map();
let activeTab = 'doors', searchTerm = '', currentVoterId = null, currentHouseId = null;

// ---- IndexedDB queue (pending = to-send, recorded = local ledger) ----
let _dbPromise = null;
function openDb() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const idb = req.result;
      if (!idb.objectStoreNames.contains('pending')) idb.createObjectStore('pending', { keyPath: 'client_uuid' });
      if (!idb.objectStoreNames.contains('recorded')) {
        const s = idb.createObjectStore('recorded', { keyPath: 'client_uuid' });
        s.createIndex('voter_id', 'voter_id', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
function _tx(store, mode, fn) {
  return openDb().then((idb) => new Promise((resolve, reject) => {
    const tx = idb.transaction(store, mode);
    const r = fn(tx.objectStore(store));
    tx.oncomplete = () => resolve(r && r.result);
    tx.onerror = () => reject(tx.error);
  }));
}
const db = {
  put: (s, v) => _tx(s, 'readwrite', (os) => os.put(v)),
  get: (s, k) => _tx(s, 'readonly', (os) => os.get(k)),
  getAll: (s) => _tx(s, 'readonly', (os) => os.getAll()),
  byIndex: (s, i, k) => _tx(s, 'readonly', (os) => os.index(i).getAll(k)),
};

async function requestPersistence() {
  if (navigator.storage && navigator.storage.persist) {
    try { await navigator.storage.persist(); } catch (e) { /* ignore */ }
  }
}

// ---- Submission pipeline ----
async function submitContact({ score, phone, notes }) {
  const err = document.getElementById('contact-error'); err.textContent = '';
  const payload = {
    client_uuid: crypto.randomUUID(),
    voter_id: currentVoterId, house_id: null, house_status: null,
    score: score == null ? null : Number(score),
    phone: phone || '', notes: notes || '',
    created_at: Date.now(), attempts: 0, status: 'queued',
  };
  try { await db.put('pending', payload); }
  catch (e) { err.textContent = 'Could not save locally: ' + (e.message || e); return; }
  try { await db.put('recorded', { ...payload }); } catch (e) { /* non-fatal */ }
  document.getElementById('contact-modal').classList.add('hidden');
  document.getElementById('contact-form').reset();
  document.querySelectorAll('#score-radio label').forEach((l) => l.classList.remove('checked'));
  flushPending();
  if (currentVoterId) openVoter(currentVoterId);
  updateSummary();
}

async function recordHouseStatus(status) {
  if (!currentHouseId) return;
  const payload = {
    client_uuid: crypto.randomUUID(),
    voter_id: null, house_id: currentHouseId, house_status: status,
    score: null, phone: '', notes: '', created_at: Date.now(),
    attempts: 0, status: 'queued',
  };
  await db.put('pending', payload);
  await db.put('recorded', { ...payload });
  document.getElementById('house-status-msg').textContent =
    status === 'not_home' ? 'Marked: Not home' : 'Marked: Inaccessible';
  flushPending(); updateSummary();
}

let _flushing = false;
async function flushPending() {
  if (_flushing) return;
  _flushing = true;
  try {
    const queue = await db.getAll('pending') || [];
    for (const row of queue) {
      if (row.status === 'synced' || row.status === 'failed_permanent') continue;
      let res;
      try {
        res = await fetch(BASE + '/api/contact', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(row),
        });
      } catch (e) {
        row.attempts = (row.attempts || 0) + 1; row.last_error = 'network';
        await db.put('pending', row); break;
      }
      if (res.status === 200) {
        row.status = 'synced'; row.synced_at = Date.now(); await db.put('pending', row);
        const rec = await db.get('recorded', row.client_uuid);
        if (rec) { rec.status = 'synced'; await db.put('recorded', rec); }
      } else if (res.status === 401 || res.status === 403) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname); return;
      } else if (res.status >= 400 && res.status < 500) {
        row.attempts = (row.attempts || 0) + 1;
        try { row.last_error = (await res.json()).error; } catch (e) { row.last_error = 'http ' + res.status; }
        if (row.attempts >= 10) row.status = 'failed_permanent';
        await db.put('pending', row);
      } else {
        row.attempts = (row.attempts || 0) + 1; await db.put('pending', row); break;
      }
    }
  } finally { _flushing = false; updateSummary(); }
}

// ---- Rendering ----
function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function humanize(k) { return String(k).replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()); }
function renderDetail(el, obj, skip = new Set()) {
  el.textContent = '';
  const dl = document.createElement('dl');
  for (const [k, v] of Object.entries(obj)) {
    if (skip.has(k) || v == null || v === '' || typeof v === 'object') continue;
    const dt = document.createElement('dt'); dt.textContent = humanize(k);
    const dd = document.createElement('dd'); dd.textContent = String(v);
    dl.append(dt, dd);
  }
  el.appendChild(dl);
}
function getHouse(id) { return HOUSES_BY_ID.get(id); }
function getVoter(id) { return VOTERS_BY_ID.get(id); }
function votersAtHouse(hid) {
  const h = getHouse(hid); if (!h) return [];
  return (h.voters || []).map((v) => getVoter(v)).filter(Boolean);
}

function renderHouseList() {
  const ul = document.getElementById('house-list'); ul.textContent = '';
  const term = searchTerm.toLowerCase();
  for (const h of APP_DATA.houses || []) {
    if (term && !String(h.address || '').toLowerCase().includes(term)) continue;
    const li = document.createElement('li');
    const p = document.createElement('span'); p.className = 'primary';
    p.textContent = h.address || h.house_id;
    const s = document.createElement('span'); s.className = 'secondary';
    const n = (h.voters || []).length; s.textContent = n + ' voter' + (n === 1 ? '' : 's');
    li.append(p, s);
    li.addEventListener('click', () => openHouse(h.house_id));
    ul.appendChild(li);
  }
}
function renderVoterList() {
  const ul = document.getElementById('voter-list'); ul.textContent = '';
  const term = searchTerm.toLowerCase();
  for (const v of APP_DATA.voters || []) {
    const name = ((v.first_name || '') + ' ' + (v.last_name || '')).trim();
    const h = getHouse(v.house_id); const addr = h ? (h.address || '') : '';
    if (term && !name.toLowerCase().includes(term) && !addr.toLowerCase().includes(term)) continue;
    const li = document.createElement('li');
    const p = document.createElement('span'); p.className = 'primary'; p.textContent = name;
    const s = document.createElement('span'); s.className = 'secondary'; s.textContent = addr;
    li.append(p, s);
    li.addEventListener('click', () => openVoter(v.voter_id));
    ul.appendChild(li);
  }
}
function setTab(tab) {
  activeTab = tab;
  document.getElementById('tab-doors').classList.toggle('secondary', tab !== 'doors');
  document.getElementById('tab-voters').classList.toggle('secondary', tab !== 'voters');
  document.getElementById('house-list').classList.toggle('hidden', tab !== 'doors');
  document.getElementById('voter-list').classList.toggle('hidden', tab !== 'voters');
  if (tab === 'doors') renderHouseList(); else renderVoterList();
}

function openHouse(hid) {
  const h = getHouse(hid); if (!h) return;
  currentHouseId = hid;
  document.getElementById('house-status-msg').textContent = '';
  document.getElementById('house-address').textContent = h.address || h.house_id;
  renderDetail(document.getElementById('house-detail'), h, new Set(['voters']));
  const ul = document.getElementById('house-voters'); ul.textContent = '';
  for (const v of votersAtHouse(hid)) {
    const li = document.createElement('li');
    const p = document.createElement('span'); p.className = 'primary';
    p.textContent = ((v.first_name || '') + ' ' + (v.last_name || '')).trim();
    li.appendChild(p);
    li.addEventListener('click', () => openVoter(v.voter_id));
    ul.appendChild(li);
  }
  show('screen-house');
}

async function openVoter(vid) {
  const v = getVoter(vid); if (!v) return;
  currentVoterId = vid;
  document.getElementById('voter-name').textContent =
    ((v.first_name || '') + ' ' + (v.last_name || '')).trim();
  renderDetail(document.getElementById('voter-detail'), v);
  const prev = document.getElementById('prev-contacts'); prev.textContent = '';
  let recs = [];
  try { recs = await db.byIndex('recorded', 'voter_id', vid) || []; } catch (e) { /* ignore */ }
  recs.sort((a, b) => b.created_at - a.created_at);
  for (const r of recs) {
    const li = document.createElement('li');
    const p = document.createElement('span'); p.className = 'primary';
    p.textContent = (r.score == null ? '—' : 'score ' + r.score) + ' · ' +
      new Date(r.created_at).toLocaleString();
    if (r.status !== 'synced') {
      const b = document.createElement('span'); b.className = 'badge';
      b.textContent = r.status === 'failed_permanent' ? 'failed' : 'pending';
      p.appendChild(b);
    }
    const s = document.createElement('span'); s.className = 'secondary';
    s.textContent = r.notes || '(no notes)';
    li.append(p, s); prev.appendChild(li);
  }
  show('screen-voter');
}

async function renderNotes() {
  let all = [];
  try { all = await db.getAll('recorded') || []; } catch (e) { /* ignore */ }
  all.sort((a, b) => b.created_at - a.created_at);
  document.getElementById('notes-summary').textContent =
    all.length + ' contact' + (all.length === 1 ? '' : 's') + ' recorded on this device';
  const ul = document.getElementById('notes-list'); ul.textContent = '';
  for (const r of all) {
    const li = document.createElement('li');
    const p = document.createElement('span'); p.className = 'primary';
    let subj = r.voter_id ? (getVoter(r.voter_id)
      ? (getVoter(r.voter_id).first_name + ' ' + getVoter(r.voter_id).last_name).trim()
      : r.voter_id) : (getHouse(r.house_id) ? getHouse(r.house_id).address : r.house_id);
    const tag = r.house_status ? r.house_status.replace('_', ' ')
      : (r.score != null ? 'score ' + r.score : '');
    p.textContent = tag ? subj + ' · ' + tag : subj;
    if (r.status !== 'synced') {
      const b = document.createElement('span'); b.className = 'badge';
      b.textContent = r.status === 'failed_permanent' ? 'failed' : 'pending';
      p.appendChild(b);
    }
    const s = document.createElement('span'); s.className = 'secondary';
    s.textContent = new Date(r.created_at).toLocaleString() + (r.notes ? ' · ' + r.notes : '');
    li.append(p, s); ul.appendChild(li);
  }
}

async function updateSummary() {
  const bar = document.getElementById('summary');
  const link = document.getElementById('sync-link');
  let all = [], pend = [];
  try { all = await db.getAll('recorded') || []; } catch (e) { /* ignore */ }
  try { pend = (await db.getAll('pending') || []).filter((r) => r.status !== 'synced' && r.status !== 'failed_permanent'); } catch (e) { /* ignore */ }
  link.textContent = all.length ? (all.length + (pend.length ? ' · ' + pend.length + ' unsynced' : ' · synced')) : '';
  if (pend.length) {
    bar.className = 'warn'; bar.textContent =
      all.length + ' contacts · ' + pend.length + ' waiting to sync — keep this open';
  } else if (all.length) {
    bar.className = ''; bar.textContent = all.length + ' contacts · all synced';
  } else { bar.className = 'hidden'; bar.textContent = ''; }
}

// ---- Wiring ----
document.getElementById('tab-doors').addEventListener('click', () => setTab('doors'));
document.getElementById('tab-voters').addEventListener('click', () => setTab('voters'));
let _deb;
document.getElementById('search').addEventListener('input', (e) => {
  clearTimeout(_deb); const v = e.target.value;
  _deb = setTimeout(() => { searchTerm = v; activeTab === 'doors' ? renderHouseList() : renderVoterList(); }, 150);
});
document.getElementById('house-back').addEventListener('click', () => show('screen-list'));
document.getElementById('voter-back').addEventListener('click', () => show('screen-list'));
document.getElementById('notes-back').addEventListener('click', () => show('screen-list'));
document.getElementById('house-not-home').addEventListener('click', () => recordHouseStatus('not_home'));
document.getElementById('house-inaccessible').addEventListener('click', () => recordHouseStatus('inaccessible'));
document.getElementById('open-contact-btn').addEventListener('click', () => {
  const v = getVoter(currentVoterId);
  document.getElementById('contact-voter-name').textContent =
    v ? (v.first_name + ' ' + v.last_name).trim() : currentVoterId;
  document.getElementById('contact-error').textContent = '';
  document.getElementById('contact-modal').classList.remove('hidden');
});
document.getElementById('contact-cancel').addEventListener('click', () => {
  document.getElementById('contact-modal').classList.add('hidden');
  document.getElementById('contact-form').reset();
});
document.querySelectorAll('#score-radio input').forEach((i) => {
  i.addEventListener('change', () => {
    document.querySelectorAll('#score-radio label').forEach((l) => l.classList.remove('checked'));
    i.closest('label').classList.add('checked');
  });
});
document.getElementById('contact-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = document.getElementById('contact-submit'); btn.disabled = true;
  try { await submitContact({ score: fd.get('score'), phone: fd.get('phone'), notes: fd.get('notes') }); }
  finally { btn.disabled = false; }
});
document.getElementById('sync-link').addEventListener('click', (e) => {
  e.preventDefault(); renderNotes(); show('screen-notes');
});
document.getElementById('sync-now').addEventListener('click', () => { flushPending(); renderNotes(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') flushPending();
});
window.addEventListener('online', flushPending);

async function boot() {
  await requestPersistence();
  try { await flushPending(); } catch (e) { /* ignore */ }
  let res;
  try { res = await fetch(BASE + '/api/app-data'); }
  catch (e) { document.getElementById('loading-msg').textContent = 'Offline — could not load voter file.'; return; }
  if (res.status === 401 || res.status === 403) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname); return;
  }
  if (res.status === 404) {
    document.getElementById('loading-msg').textContent =
      'No voter file uploaded for this campaign yet. Check back later.';
    return;
  }
  if (!res.ok) { document.getElementById('loading-msg').textContent = 'Could not load voter file.'; return; }
  APP_DATA = await res.json();
  HOUSES_BY_ID = new Map((APP_DATA.houses || []).map((h) => [h.house_id, h]));
  VOTERS_BY_ID = new Map((APP_DATA.voters || []).map((v) => [v.voter_id, v]));
  setTab('doors');
  show('screen-list');
  updateSummary();
  setInterval(flushPending, 30000);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
